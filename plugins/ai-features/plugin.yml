# AI Features - Master AI Configuration + Local Ollama Provider
id: ai-features
name: AI Features
version: 1.0.0
description: Configure AI features and run models locally with Ollama

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: providers

# What this plugin provides (required)
capabilities:
  - provider
  - provider:ollama
  - embedding
  - chat

# Required permissions
permissions:
  - network
