# MusicBrainz Plugin Manifest
id: musicbrainz
name: MusicBrainz Enricher
version: 1.0.0
description: Fetches music metadata from MusicBrainz and cover art from Cover Art Archive

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: enrichers

# What this plugin provides (required)
capabilities:
  - metadata
  - artwork
  - external_ids

# Media types this enricher supports
media_types:
  - music
  - music_album
  - music_artist

# Required permissions
permissions:
  - network
  - storage:database
  - data:media:read
  - data:metadata:write
