# OpenAI Provider Plugin Manifest
id: provider-openai
name: OpenAI Provider
version: 1.0.0
description: AI provider using OpenAI API for chat and embeddings

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

# Minimum ViewRA version required
min_host_version: "0.1.0"

# Plugin capabilities
categories:
  - provider

# What this plugin provides to other plugins
provides:
  - provider
  - provider:openai

# Permissions required
permissions:
  - network  # For OpenAI API calls
