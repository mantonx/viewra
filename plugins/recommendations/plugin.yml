# Recommendations Plugin Manifest
# Provides personalized recommendations for the home screen

id: recommendations
name: Recommendations
version: 1.0.0
description: Personalized recommendations based on user ratings and watch history

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

# Minimum ViewRA version required
min_host_version: "0.1.0"

# Plugin capabilities
categories:
  - recommendations
  - widgets

# What this plugin provides
capabilities:
  provides:
    - recommendations
    - widgets
  requires:
    - embedding  # Uses semantic search for "similar to" recommendations

# Permissions required
permissions:
  - storage:database
  - data:media:read
