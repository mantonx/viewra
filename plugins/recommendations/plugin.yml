# Recommendations Plugin Manifest
id: recommendations
name: Recommendations
version: 1.0.0
description: Personalized recommendations based on user ratings and watch history

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: recommendations

# What this plugin provides (required)
capabilities:
  - recommendations
  - widgets

# What this plugin requires from other plugins
requires:
  - embedding

# Required permissions
permissions:
  - storage:database
  - data:media:read
