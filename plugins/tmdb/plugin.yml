# TMDb Plugin Manifest
# This file describes the plugin - it ships with the plugin binary

id: tmdb
name: TMDb Enricher
version: 1.1.0
description: Fetches movie and TV metadata from The Movie Database (TMDb), including trending content

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

# Minimum ViewRA version required
min_host_version: "0.1.0"

# Plugin capabilities
categories:
  - enricher
  - trending  # Provides trending data for home screen

# What this enricher provides
capabilities:
  media_types:
    - movie
    - tv
    - tv_show
  provides:
    - metadata
    - artwork
    - external_ids
    - trending  # Trending movies and TV shows
  is_local: false
  rate_limit: 40  # requests per 10 seconds

# Permissions required
permissions:
  - network
  - storage:database
  - data:media:read
  - data:metadata:write
