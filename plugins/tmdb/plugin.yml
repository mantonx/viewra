# TMDb Plugin Manifest
id: tmdb
name: TMDb Enricher
version: 1.1.0
description: Fetches movie and TV metadata from The Movie Database (TMDb), including trending content

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: enrichers

# What this plugin provides (required)
capabilities:
  - metadata
  - artwork
  - external_ids
  - trending

# Media types this enricher supports
media_types:
  - movie
  - tv
  - tv_show

# Required permissions
permissions:
  - network
  - storage:database
  - data:media:read
  - data:metadata:write
