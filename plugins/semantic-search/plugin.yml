# Semantic Search Plugin Manifest
id: semantic-search
name: Semantic Search
version: 1.1.0
description: AI-powered semantic search for media with contextual suggestions

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: search

# What this plugin provides (required)
capabilities:
  - search
  - search_provider
  - vector_search

# What this plugin requires from other plugins
requires:
  - embedding

# Media types this enricher supports
media_types:
  - movie
  - tv
  - tv_show
  - tv_episode
  - music_artist
  - music_album
  - music_track

# Required permissions
permissions:
  - network
  - data:media:read
  - weather:read
