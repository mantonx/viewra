# Semantic Search Plugin Manifest
id: semantic-search
name: Semantic Search
version: 1.1.0
description: AI-powered semantic search for media with contextual suggestions

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

# Minimum ViewRA version required
min_host_version: "0.1.0"

# Plugin categories
categories:
  - enricher
  - ai
  - search_provider  # Provides search for home screen

# What capabilities this plugin provides to other plugins
# Other plugins can depend on these via their 'requires' field
provides:
  - search
  - search_provider  # Home screen search hero provider
  - vector_search    # Allows other plugins to call FindSimilar/Search via InvokeVectorSearch

# What capabilities this plugin requires from other plugins
# The host will check that at least one enabled plugin provides each capability
requires:
  - embedding

# Media types this enricher supports
media_types:
  - movie
  - tv
  - tv_show
  - tv_episode
  - music_artist
  - music_album
  - music_track

# Permissions required
permissions:
  - network              # For LLM API calls via provider plugins
  - data:media:read      # Read media metadata for indexing
  - weather:read         # Read weather context for query enrichment
