# OpenAI Provider Plugin Manifest
id: ai-provider-openai
name: OpenAI
version: 1.0.0
description: AI provider using OpenAI API for chat and embeddings

author: ViewRA Team
license: MIT
homepage: https://github.com/mantonx/viewra

min_host_version: "0.1.0"

# UI grouping (required) - valid values: search, recommendations, enrichers, providers, local, other
display_category: providers

# What this plugin provides (required)
capabilities:
  - provider
  - provider:openai
  - embedding
  - chat

# Required permissions
permissions:
  - network
