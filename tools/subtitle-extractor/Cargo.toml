[package]
name = "subtitle-extractor"
version = "0.1.0"
edition = "2021"
description = "Fast subtitle track extractor for multiple container formats"

[dependencies]
# Container demuxers
matroska-demuxer = "0.7"

# PGS subtitle decoding
pgs-rs = "0.1"

# Image encoding
png = "0.17"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
