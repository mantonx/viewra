# Build ViewRA dependencies (FFmpeg, subtitle-extractor, plugins)
# Creates portable binary archives for use in Docker builds
#
# Uses the same Makefile targets as local development to stay in sync.
#
# Trigger manually or when source files change

name: Build Dependencies

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '7.1'
  push:
    paths:
      - 'tools/ffmpeg-viewra/**'
      - 'tools/subtitle-extractor/**'
      - 'plugins/**'
      - 'pkg/plugin/sdk/**'
      - 'api/proto/plugin/**'
    branches:
      - main

jobs:
  build-ffmpeg:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || '7.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: bin/ffmpeg-viewra
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/ffmpeg-viewra/**') }}

      - name: Install build dependencies
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # Add NVIDIA CUDA repository for Ubuntu 24.04
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm yasm git curl \
            libx264-dev libx265-dev libvpx-dev \
            libsvtav1-dev libsvtav1enc-dev libdav1d-dev \
            libopus-dev libvorbis-dev libmp3lame-dev libfdk-aac-dev \
            libass-dev libfreetype-dev libfontconfig1-dev libssl-dev \
            libva-dev libvdpau-dev libdrm-dev ocl-icd-opencl-dev \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6
          # Install NVIDIA codec headers for NVENC/NVDEC support
          git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers
          sudo make install
          cd .. && rm -rf nv-codec-headers

      - name: Build FFmpeg using Makefile
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # CUDA installed via apt to /usr/local/cuda-12.6
          export PATH="/usr/local/cuda-12.6/bin:${PATH}"
          echo "nvcc location: $(which nvcc 2>/dev/null || echo 'not found')"
          nvcc --version || true
          make build-ffmpeg

      - name: Package FFmpeg
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/ffmpeg-viewra-linux-x64.tar.gz" \
            ffmpeg-viewra ffprobe-viewra ffmpeg-lib/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-viewra-linux-x64
          path: ffmpeg-viewra-linux-x64.tar.gz

  build-subtitle-extractor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/subtitle-extractor/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/subtitle-extractor/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build subtitle-extractor using Makefile
        run: make build-tools

      - name: Package binary
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/subtitle-extractor-linux-x64.tar.gz" subtitle-extractor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-extractor-linux-x64
          path: subtitle-extractor-linux-x64.tar.gz

  build-plugins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            plugins/*/go.sum

      - name: Build all plugins using Makefile
        run: make build-plugins

      - name: Package plugins
        run: |
          cd data/plugins
          tar czf "${GITHUB_WORKSPACE}/viewra-plugins-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewra-plugins-linux-x64
          path: viewra-plugins-linux-x64.tar.gz

  release:
    needs: [build-ffmpeg, build-subtitle-extractor, build-plugins]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || '7.1' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "deps-latest"
          name: "ViewRA Dependencies (Latest)"
          body: |
            Pre-built dependencies for ViewRA Docker builds.

            **FFmpeg ${{ env.FFMPEG_VERSION }}** (with ViewRA patches):
            - Video: x264, x265, VP9, SVT-AV1, dav1d
            - Audio: Opus, Vorbis, MP3, FDK-AAC
            - Hardware: VAAPI, VDPAU, NVENC/NVDEC (stubs)
            - Subtitles: libass, freetype

            **subtitle-extractor**: Fast subtitle extraction tool (Rust)

            **plugins**: All ViewRA plugins pre-compiled
          files: |
            ffmpeg-viewra-linux-x64/ffmpeg-viewra-linux-x64.tar.gz
            subtitle-extractor-linux-x64/subtitle-extractor-linux-x64.tar.gz
            viewra-plugins-linux-x64/viewra-plugins-linux-x64.tar.gz
          draft: false
          prerelease: false
