# Build ViewRA dependencies (FFmpeg, subtitle-extractor, plugins)
# Creates portable binary archives published as GitHub releases.
#
# Release naming:
#   - ffmpeg-v7.1.0, ffmpeg-v7.1.1, etc.
#   - subtitle-extractor-v0.1.0, v0.1.1, etc.
#   - plugin-{name}-v1.0.0, v1.0.1, etc.
#
# Each release includes checksums and auto-generated changelogs.
#
# Triggers:
#   - Manual (workflow_dispatch): builds everything
#   - Push to main: builds only changed components

name: Build Dependencies

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '7.1'
  push:
    paths:
      - 'tools/ffmpeg-viewra/**'
      - 'tools/subtitle-extractor/**'
      - 'plugins/**'
      - 'pkg/plugin/sdk/**'
      - 'api/proto/plugin/**'
    branches:
      - main

jobs:
  # ============================================================================
  # FFmpeg Build
  # ============================================================================
  build-ffmpeg:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits.*.modified, 'tools/ffmpeg-viewra/') || contains(github.event.commits.*.added, 'tools/ffmpeg-viewra/')
    permissions:
      contents: write
    env:
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || '7.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            bin/ffmpeg-viewra
            bin/ffprobe-viewra
            bin/ffmpeg-lib
          key: ffmpeg-v3-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/ffmpeg-viewra/**') }}

      - name: Install build dependencies
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm yasm git curl cmake \
            libx264-dev libx265-dev libvpx-dev \
            libsvtav1-dev libsvtav1enc-dev libdav1d-dev \
            libopus-dev libvorbis-dev libmp3lame-dev libfdk-aac-dev \
            libass-dev libfreetype-dev libfontconfig1-dev libssl-dev \
            libva-dev libvdpau-dev libdrm-dev ocl-icd-opencl-dev \
            libvpl-dev libplacebo-dev libshaderc-dev libvulkan-dev \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6
          # nv-codec-headers for NVENC/NVDEC
          git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers && sudo make install && cd ..
          # Newer Vulkan headers (FFmpeg 7.x requires >= 1.3.277, Ubuntu 24.04 has 1.3.275)
          git clone --depth 1 --branch v1.3.283 https://github.com/KhronosGroup/Vulkan-Headers.git
          cd Vulkan-Headers && cmake -B build -DCMAKE_INSTALL_PREFIX=/usr && sudo cmake --install build

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          export PATH="/usr/local/cuda-12.6/bin:${PATH}"
          make build-ffmpeg

      - name: Package FFmpeg
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/ffmpeg-viewra-linux-x64.tar.gz" \
            ffmpeg-viewra ffprobe-viewra ffmpeg-lib/

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum ffmpeg-viewra-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Calculate version
        id: version
        run: |
          # Find latest ffmpeg release and increment patch
          LATEST=$(git tag -l "ffmpeg-v${FFMPEG_VERSION}.*" --sort=-v:refname | head -1)
          if [ -n "$LATEST" ]; then
            PATCH=$(echo "$LATEST" | sed -E 's/ffmpeg-v[0-9]+\.[0-9]+\.([0-9]+)/\1/')
            NEXT=$((PATCH + 1))
          else
            NEXT=0
          fi
          echo "version=${FFMPEG_VERSION}.${NEXT}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ffmpeg-v${{ steps.version.outputs.version }}"
          name: "FFmpeg ${{ steps.version.outputs.version }}"
          body: |
            ## FFmpeg ${{ steps.version.outputs.version }}

            Custom FFmpeg build with ViewRA patches for HLS streaming.

            ### Features
            - **Video:** x264, x265, VP9, SVT-AV1, dav1d
            - **Audio:** Opus, Vorbis, MP3, FDK-AAC
            - **Hardware:** VAAPI, VDPAU, NVENC/NVDEC, CUDA, OpenCL, Intel QSV (oneVPL)
            - **HDR:** Vulkan + libplacebo tone mapping
            - **Subtitles:** libass, freetype

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  ffmpeg-viewra-linux-x64.tar.gz
            ```
          files: ffmpeg-viewra-linux-x64.tar.gz

  # ============================================================================
  # Subtitle Extractor Build
  # ============================================================================
  build-subtitle-extractor:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits.*.modified, 'tools/subtitle-extractor/') || contains(github.event.commits.*.added, 'tools/subtitle-extractor/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/subtitle-extractor/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/subtitle-extractor/Cargo.lock') }}

      - name: Build subtitle-extractor
        run: make build-tools

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' tools/subtitle-extractor/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package binary
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/subtitle-extractor-linux-x64.tar.gz" subtitle-extractor

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum subtitle-extractor-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "subtitle-extractor-v${{ steps.cargo_version.outputs.version }}"
          name: "subtitle-extractor ${{ steps.cargo_version.outputs.version }}"
          make_latest: true
          body: |
            ## subtitle-extractor ${{ steps.cargo_version.outputs.version }}

            Fast subtitle extraction tool written in Rust.

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  subtitle-extractor-linux-x64.tar.gz
            ```
          files: subtitle-extractor-linux-x64.tar.gz

  # ============================================================================
  # Plugin Builds
  # ============================================================================
  detect-plugins:
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect plugins to build
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: build all plugins
            PLUGINS=$(ls -d plugins/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Push trigger: check what changed
            SDK_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^(pkg/plugin/sdk/|api/proto/plugin/)' || true)
            if [ -n "$SDK_CHANGED" ]; then
              # SDK changed: rebuild all plugins
              PLUGINS=$(ls -d plugins/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              # Only build changed plugins
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^plugins/' | cut -d'/' -f2 | sort -u)
              if [ -n "$CHANGED" ]; then
                PLUGINS=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              else
                PLUGINS="[]"
              fi
            fi
          fi
          echo "plugins=${PLUGINS}" >> $GITHUB_OUTPUT
          echo "Plugins to build: ${PLUGINS}"

  build-plugin:
    needs: detect-plugins
    if: needs.detect-plugins.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect-plugins.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            plugins/${{ matrix.plugin }}/go.sum

      - name: Build plugin
        run: make build-plugin NAME=${{ matrix.plugin }}

      - name: Get plugin version
        id: info
        run: |
          if [ -f "plugins/${{ matrix.plugin }}/plugin.yml" ]; then
            VERSION=$(grep -E '^version:' "plugins/${{ matrix.plugin }}/plugin.yml" | sed 's/version: *//' | head -1)
            DESC=$(grep -E '^description:' "plugins/${{ matrix.plugin }}/plugin.yml" | sed 's/description: *//' | head -1)
          else
            VERSION="1.0.0"
            DESC="ViewRA plugin"
          fi
          echo "version=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT
          echo "description=${DESC:-ViewRA plugin}" >> $GITHUB_OUTPUT

      - name: Package plugin
        run: |
          cd data/plugins/${{ matrix.plugin }}
          tar czf "${GITHUB_WORKSPACE}/plugin-${{ matrix.plugin }}-linux-x64.tar.gz" .

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum plugin-${{ matrix.plugin }}-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "plugin-${{ matrix.plugin }}-v${{ steps.info.outputs.version }}"
          name: "${{ matrix.plugin }} ${{ steps.info.outputs.version }}"
          body: |
            ## ${{ matrix.plugin }} ${{ steps.info.outputs.version }}

            ${{ steps.info.outputs.description }}

            ### Installation
            Extract to `plugins/${{ matrix.plugin }}/`

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  plugin-${{ matrix.plugin }}-linux-x64.tar.gz
            ```
          files: plugin-${{ matrix.plugin }}-linux-x64.tar.gz
