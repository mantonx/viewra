# Build ViewRA dependencies (FFmpeg, subtitle-extractor, plugins)
# Creates portable binary archives for use in Docker builds
#
# Each component has versioned releases (e.g., ffmpeg-v7.1.3) plus a *-latest tag.
# Includes auto-generated changelogs from commits since last release.
#
# Trigger manually or when source files change

name: Build Dependencies

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '7.1'
  push:
    paths:
      - 'tools/ffmpeg-viewra/**'
      - 'tools/subtitle-extractor/**'
      - 'plugins/**'
      - 'pkg/plugin/sdk/**'
      - 'api/proto/plugin/**'
    branches:
      - main

jobs:
  build-ffmpeg:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits.*.modified, 'tools/ffmpeg-viewra/') || contains(github.event.commits.*.added, 'tools/ffmpeg-viewra/')
    permissions:
      contents: write
    env:
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || '7.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            bin/ffmpeg-viewra
            bin/ffprobe-viewra
            bin/ffmpeg-lib
          key: ffmpeg-v2-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/ffmpeg-viewra/**') }}

      - name: Install build dependencies
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # Add NVIDIA CUDA repository for Ubuntu 24.04
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm yasm git curl \
            libx264-dev libx265-dev libvpx-dev \
            libsvtav1-dev libsvtav1enc-dev libdav1d-dev \
            libopus-dev libvorbis-dev libmp3lame-dev libfdk-aac-dev \
            libass-dev libfreetype-dev libfontconfig1-dev libssl-dev \
            libva-dev libvdpau-dev libdrm-dev ocl-icd-opencl-dev \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6
          # Install NVIDIA codec headers for NVENC/NVDEC support
          git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers.git
          cd nv-codec-headers
          sudo make install
          cd .. && rm -rf nv-codec-headers

      - name: Build FFmpeg using Makefile
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          # CUDA installed via apt to /usr/local/cuda-12.6
          export PATH="/usr/local/cuda-12.6/bin:${PATH}"
          echo "nvcc location: $(which nvcc 2>/dev/null || echo 'not found')"
          nvcc --version || true
          make build-ffmpeg

      - name: Package FFmpeg
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/ffmpeg-viewra-linux-x64.tar.gz" \
            ffmpeg-viewra ffprobe-viewra ffmpeg-lib/

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum ffmpeg-viewra-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: List applied patches
        id: patches
        run: |
          PATCHES=$(ls -1 tools/ffmpeg-viewra/patches/*.patch 2>/dev/null | xargs -I{} basename {} .patch | tr '\n' ', ' | sed 's/,$//')
          echo "list=${PATCHES}" >> $GITHUB_OUTPUT

      - name: Calculate version and changelog
        id: version
        run: |
          # Get the latest versioned tag for ffmpeg
          PREV_TAG=$(git tag -l "ffmpeg-v*" --sort=-v:refname | head -1)

          # Calculate next version: ffmpeg-v{FFMPEG_VERSION}.{patch}
          if [ -n "$PREV_TAG" ]; then
            # Extract patch number and increment
            PATCH=$(echo "$PREV_TAG" | sed -E 's/ffmpeg-v[0-9]+\.[0-9]+\.([0-9]+)/\1/')
            NEXT_PATCH=$((PATCH + 1))
            # Generate changelog
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline -- tools/ffmpeg-viewra/ | head -20)
          else
            NEXT_PATCH=1
            CHANGELOG="Initial release"
          fi

          VERSION="${FFMPEG_VERSION}.${NEXT_PATCH}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "prev_tag=${PREV_TAG:-none}" >> $GITHUB_OUTPUT

          # Handle multiline changelog
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create versioned FFmpeg release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ffmpeg-v${{ steps.version.outputs.version }}"
          name: "FFmpeg ${{ steps.version.outputs.version }}"
          body: |
            ## FFmpeg ${{ env.FFMPEG_VERSION }} with ViewRA patches (build ${{ steps.version.outputs.version }})

            ### What's Changed
            ${{ steps.version.outputs.changelog }}

            **Previous release:** ${{ steps.version.outputs.prev_tag }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Features
            - **Video:** x264, x265, VP9, SVT-AV1, dav1d
            - **Audio:** Opus, Vorbis, MP3, FDK-AAC
            - **Hardware:** VAAPI, VDPAU, NVENC/NVDEC, CUDA tonemap, OpenCL
            - **Subtitles:** libass, freetype

            ### Applied Patches
            ${{ steps.patches.outputs.list }}

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  ffmpeg-viewra-linux-x64.tar.gz
            ```
          files: ffmpeg-viewra-linux-x64.tar.gz
          draft: false
          prerelease: false

      - name: Update ffmpeg-latest tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ffmpeg-latest"
          name: "FFmpeg (Latest)"
          body: |
            **Latest stable FFmpeg build.** Currently points to v${{ steps.version.outputs.version }}.

            For changelog and details, see [ffmpeg-v${{ steps.version.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/ffmpeg-v${{ steps.version.outputs.version }}).
          files: ffmpeg-viewra-linux-x64.tar.gz
          draft: false
          prerelease: false

  build-subtitle-extractor:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits.*.modified, 'tools/subtitle-extractor/') || contains(github.event.commits.*.added, 'tools/subtitle-extractor/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/subtitle-extractor/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/subtitle-extractor/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build subtitle-extractor using Makefile
        run: make build-tools

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' tools/subtitle-extractor/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package binary
        run: |
          cd bin
          tar czf "${GITHUB_WORKSPACE}/subtitle-extractor-linux-x64.tar.gz" subtitle-extractor

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum subtitle-extractor-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Calculate version and changelog
        id: version
        run: |
          CARGO_VER="${{ steps.cargo_version.outputs.version }}"
          PREV_TAG=$(git tag -l "subtitle-extractor-v*" --sort=-v:refname | head -1)

          if [ -n "$PREV_TAG" ]; then
            # Check if Cargo version changed
            PREV_VER=$(echo "$PREV_TAG" | sed 's/subtitle-extractor-v//')
            if [ "$CARGO_VER" != "$PREV_VER" ]; then
              # Version bumped in Cargo.toml
              VERSION="$CARGO_VER"
            else
              # Same version, increment build number (e.g., 1.0.0 -> 1.0.0-1)
              if [[ "$PREV_TAG" =~ -([0-9]+)$ ]]; then
                BUILD=$((${BASH_REMATCH[1]} + 1))
                VERSION="${CARGO_VER}-${BUILD}"
              else
                VERSION="${CARGO_VER}-1"
              fi
            fi
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline -- tools/subtitle-extractor/ | head -20)
          else
            VERSION="$CARGO_VER"
            CHANGELOG="Initial release"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "prev_tag=${PREV_TAG:-none}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create versioned subtitle-extractor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "subtitle-extractor-v${{ steps.version.outputs.version }}"
          name: "subtitle-extractor v${{ steps.version.outputs.version }}"
          body: |
            ## subtitle-extractor v${{ steps.version.outputs.version }}

            Fast subtitle extraction tool written in Rust.

            ### What's Changed
            ${{ steps.version.outputs.changelog }}

            **Previous release:** ${{ steps.version.outputs.prev_tag }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  subtitle-extractor-linux-x64.tar.gz
            ```
          files: subtitle-extractor-linux-x64.tar.gz
          draft: false
          prerelease: false

      - name: Update subtitle-extractor-latest tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "subtitle-extractor-latest"
          name: "subtitle-extractor (Latest)"
          body: |
            **Latest stable subtitle-extractor build.** Currently points to v${{ steps.version.outputs.version }}.

            For changelog and details, see [subtitle-extractor-v${{ steps.version.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/subtitle-extractor-v${{ steps.version.outputs.version }}).
          files: subtitle-extractor-linux-x64.tar.gz
          draft: false
          prerelease: false

  # Discover which plugins need to be built
  detect-plugins:
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff

      - name: Detect plugins to build
        id: detect
        run: |
          # On workflow_dispatch or SDK changes, build all plugins
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PLUGINS=$(ls -d plugins/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Check if SDK or proto changed (rebuild all)
            SDK_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^(pkg/plugin/sdk/|api/proto/plugin/)' || true)
            if [ -n "$SDK_CHANGED" ]; then
              PLUGINS=$(ls -d plugins/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              # Only build plugins that changed
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^plugins/' | cut -d'/' -f2 | sort -u)
              if [ -n "$CHANGED" ]; then
                PLUGINS=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              else
                PLUGINS="[]"
              fi
            fi
          fi
          echo "plugins=${PLUGINS}" >> $GITHUB_OUTPUT
          echo "Plugins to build: ${PLUGINS}"

  build-plugin:
    needs: detect-plugins
    if: needs.detect-plugins.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect-plugins.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            plugins/${{ matrix.plugin }}/go.sum

      - name: Build plugin
        run: make build-plugin NAME=${{ matrix.plugin }}

      - name: Get plugin info
        id: info
        run: |
          # Get description and version from plugin.yml if exists
          if [ -f "plugins/${{ matrix.plugin }}/plugin.yml" ]; then
            DESC=$(grep -E '^description:' "plugins/${{ matrix.plugin }}/plugin.yml" | sed 's/description: *//' | head -1)
            PLUGIN_VER=$(grep -E '^version:' "plugins/${{ matrix.plugin }}/plugin.yml" | sed 's/version: *//' | head -1)
          else
            DESC="ViewRA plugin"
            PLUGIN_VER="1.0.0"
          fi
          echo "description=${DESC}" >> $GITHUB_OUTPUT
          echo "plugin_version=${PLUGIN_VER:-1.0.0}" >> $GITHUB_OUTPUT

      - name: Package plugin
        run: |
          cd data/plugins/${{ matrix.plugin }}
          tar czf "${GITHUB_WORKSPACE}/plugin-${{ matrix.plugin }}-linux-x64.tar.gz" .

      - name: Generate checksum
        id: checksum
        run: |
          SHA256=$(sha256sum plugin-${{ matrix.plugin }}-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Calculate version and changelog
        id: version
        run: |
          PLUGIN_VER="${{ steps.info.outputs.plugin_version }}"
          PREV_TAG=$(git tag -l "plugin-${{ matrix.plugin }}-v*" --sort=-v:refname | head -1)

          if [ -n "$PREV_TAG" ]; then
            PREV_VER=$(echo "$PREV_TAG" | sed 's/plugin-${{ matrix.plugin }}-v//')
            if [ "$PLUGIN_VER" != "$PREV_VER" ] && [ "$PLUGIN_VER" != "${PREV_VER%%-*}" ]; then
              VERSION="$PLUGIN_VER"
            else
              if [[ "$PREV_TAG" =~ -([0-9]+)$ ]]; then
                BUILD=$((${BASH_REMATCH[1]} + 1))
                VERSION="${PLUGIN_VER}-${BUILD}"
              else
                VERSION="${PLUGIN_VER}-1"
              fi
            fi
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline -- plugins/${{ matrix.plugin }}/ pkg/plugin/sdk/ api/proto/plugin/ | head -20)
          else
            VERSION="$PLUGIN_VER"
            CHANGELOG="Initial release"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "prev_tag=${PREV_TAG:-none}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create versioned plugin release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "plugin-${{ matrix.plugin }}-v${{ steps.version.outputs.version }}"
          name: "${{ matrix.plugin }} v${{ steps.version.outputs.version }}"
          body: |
            ## ${{ matrix.plugin }} v${{ steps.version.outputs.version }}

            ${{ steps.info.outputs.description }}

            ### What's Changed
            ${{ steps.version.outputs.changelog }}

            **Previous release:** ${{ steps.version.outputs.prev_tag }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Installation
            Extract to `data/plugins/${{ matrix.plugin }}/`

            ### Checksum (SHA256)
            ```
            ${{ steps.checksum.outputs.sha256 }}  plugin-${{ matrix.plugin }}-linux-x64.tar.gz
            ```
          files: plugin-${{ matrix.plugin }}-linux-x64.tar.gz
          draft: false
          prerelease: false

      - name: Update plugin-latest tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "plugin-${{ matrix.plugin }}-latest"
          name: "${{ matrix.plugin }} (Latest)"
          body: |
            **Latest stable ${{ matrix.plugin }} plugin.** Currently points to v${{ steps.version.outputs.version }}.

            For changelog and details, see [plugin-${{ matrix.plugin }}-v${{ steps.version.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/plugin-${{ matrix.plugin }}-v${{ steps.version.outputs.version }}).
          files: plugin-${{ matrix.plugin }}-linux-x64.tar.gz
          draft: false
          prerelease: false
