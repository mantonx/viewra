syntax = "proto3";

package viewra.plugin.v1;

option go_package = "github.com/mantonx/viewra/api/proto/plugin/v1;pluginv1";

import "api/proto/plugin/common.proto";

// HostLLM provides access to LLM providers configured in ViewRA.
// Plugins use this to generate embeddings and chat completions.
service HostLLM {
  // ListProviders returns available LLM providers.
  rpc ListProviders(Empty) returns (LLMProviderList);

  // ListModels returns available models for a provider.
  rpc ListModels(LLMProviderQuery) returns (LLMModelList);

  // GenerateEmbedding generates embeddings for text.
  rpc GenerateEmbedding(EmbeddingRequest) returns (EmbeddingResponse);

  // GenerateEmbeddingBatch generates embeddings for multiple texts.
  rpc GenerateEmbeddingBatch(EmbeddingBatchRequest) returns (EmbeddingBatchResponse);

  // Chat sends a chat completion request.
  rpc Chat(ChatRequest) returns (ChatResponse);

  // ChatStream sends a streaming chat completion request.
  rpc ChatStream(ChatRequest) returns (stream ChatStreamChunk);
}

// HostEmbeddings provides access to the embeddings storage.
// Plugins use this to store and query vector embeddings.
service HostEmbeddings {
  // Store saves an embedding for an entity.
  rpc Store(StoreEmbeddingRequest) returns (Empty);

  // StoreBatch saves multiple embeddings.
  rpc StoreBatch(StoreBatchRequest) returns (Empty);

  // Get retrieves an embedding by entity type and ID.
  rpc Get(EmbeddingQuery) returns (StoredEmbedding);

  // Delete removes an embedding.
  rpc Delete(EmbeddingQuery) returns (Empty);

  // DeleteByType removes all embeddings for an entity type.
  rpc DeleteByType(EntityTypeQuery) returns (DeleteCountResponse);

  // Search finds similar embeddings using cosine similarity.
  rpc Search(EmbeddingSearchRequest) returns (EmbeddingSearchResponse);

  // SearchText finds embeddings where text contains the query keywords.
  // This is useful for name/title searches where semantic search fails.
  rpc SearchText(TextSearchRequest) returns (EmbeddingSearchResponse);

  // CountByType returns the number of embeddings for an entity type.
  rpc CountByType(EntityTypeQuery) returns (CountResponse);

  // CountAll returns the total number of embeddings.
  rpc CountAll(Empty) returns (CountResponse);
}

// LLM messages

message LLMProviderQuery {
  string provider_id = 1;
}

message LLMProvider {
  string id = 1;           // e.g., "ollama", "openai", "anthropic"
  string name = 2;         // Display name
  bool configured = 3;     // Whether API key/connection is configured
  bool supports_chat = 4;
  bool supports_embedding = 5;
}

message LLMProviderList {
  repeated LLMProvider providers = 1;
}

message LLMModel {
  string id = 1;           // e.g., "llama3.1:8b", "gpt-4o-mini"
  string name = 2;         // Display name
  string provider = 3;     // Provider ID
  bool is_embedding = 4;   // Whether this is an embedding model
  int32 context_length = 5;
  int32 embedding_dimensions = 6;  // For embedding models
}

message LLMModelList {
  repeated LLMModel models = 1;
}

message EmbeddingRequest {
  string text = 1;
  string provider = 2;     // Optional, uses default if empty
  string model = 3;        // Optional, uses default if empty
}

message EmbeddingResponse {
  repeated float embedding = 1;
  int32 dimensions = 2;
  int32 tokens_used = 3;
}

message EmbeddingBatchRequest {
  repeated string texts = 1;
  string provider = 2;
  string model = 3;
}

message EmbeddingBatchResponse {
  repeated EmbeddingResult embeddings = 1;
  int32 total_tokens = 2;
}

message EmbeddingResult {
  repeated float embedding = 1;
  int32 dimensions = 2;
}

message ChatMessage {
  string role = 1;         // "system", "user", "assistant"
  string content = 2;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  string provider = 2;     // Optional
  string model = 3;        // Optional
  float temperature = 4;   // 0.0 - 2.0
  int32 max_tokens = 5;
}

message ChatResponse {
  string content = 1;
  string finish_reason = 2;  // "stop", "length", "content_filter"
  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;
}

message ChatStreamChunk {
  string content = 1;
  bool done = 2;
  string finish_reason = 3;
}

// Embedding storage messages

message StoreEmbeddingRequest {
  string entity_type = 1;  // e.g., "movie", "tv_show", "tv_episode"
  int64 entity_id = 2;
  repeated float embedding = 3;
  string text = 4;         // Original text (for debugging)
  string model = 5;        // Model used to generate
}

message StoreBatchRequest {
  repeated StoreEmbeddingRequest embeddings = 1;
}

message EmbeddingQuery {
  string entity_type = 1;
  int64 entity_id = 2;
}

message EntityTypeQuery {
  string entity_type = 1;
}

message StoredEmbedding {
  string entity_type = 1;
  int64 entity_id = 2;
  repeated float embedding = 3;
  string text = 4;
  string model = 5;
  bool exists = 6;
}

message EmbeddingSearchRequest {
  repeated float query_embedding = 1;
  repeated string entity_types = 2;  // Filter by types, empty = all
  int32 limit = 3;
  float min_similarity = 4;  // 0.0 - 1.0
}

message EmbeddingSearchResult {
  string entity_type = 1;
  int64 entity_id = 2;
  float similarity = 3;
  string text = 4;
}

message EmbeddingSearchResponse {
  repeated EmbeddingSearchResult results = 1;
}

message DeleteCountResponse {
  int64 count = 1;
}

message CountResponse {
  int64 count = 1;
}

message TextSearchRequest {
  string query = 1;                  // Text to search for (case-insensitive)
  repeated string entity_types = 2;  // Filter by types, empty = all
  int32 limit = 3;
}
