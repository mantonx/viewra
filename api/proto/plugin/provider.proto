syntax = "proto3";

package viewra.plugin.v1;

option go_package = "github.com/mantonx/viewra/api/proto/plugin/v1;pluginv1";

import "api/proto/plugin/common.proto";

// PluginProvider is implemented by AI provider plugins (ollama, openai, etc.).
// Consumer plugins connect directly to providers via the capability broker.
service PluginProvider {
  // GetCapabilities returns what this provider supports.
  rpc GetCapabilities(Empty) returns (ProviderCapabilities);

  // ListModels returns available models for this provider.
  rpc ListModels(Empty) returns (ProviderModelList);

  // GenerateEmbedding generates an embedding for a single text.
  rpc GenerateEmbedding(ProviderEmbeddingRequest) returns (ProviderEmbeddingResponse);

  // GenerateEmbeddingBatch generates embeddings for multiple texts.
  rpc GenerateEmbeddingBatch(ProviderEmbeddingBatchRequest) returns (ProviderEmbeddingBatchResponse);

  // Chat sends a chat completion request.
  rpc Chat(ProviderChatRequest) returns (ProviderChatResponse);

  // ChatStream sends a streaming chat completion request.
  rpc ChatStream(ProviderChatRequest) returns (stream ProviderChatStreamChunk);

  // HealthCheck verifies the provider is working.
  rpc HealthCheck(Empty) returns (ProviderHealthStatus);
}

// ProviderCapabilities describes what an AI provider plugin supports.
message ProviderCapabilities {
  string provider_id = 1;
  string display_name = 2;
  string description = 3;
  bool supports_chat = 4;
  bool supports_embeddings = 5;
  bool supports_streaming = 6;
  bool requires_api_key = 7;
  bool requires_url = 8;
  bool is_local = 9;
  string default_chat_model = 10;
  string default_embedding_model = 11;
}

// ProviderModelList contains models available from a provider.
message ProviderModelList {
  repeated ProviderModel models = 1;
}

// ProviderModel describes a model available from a provider.
message ProviderModel {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_chat = 4;
  bool is_embedding = 5;
  int32 context_length = 6;
  int32 embedding_dimensions = 7;
  string size = 8;
  bool recommended = 9;
}

// ProviderEmbeddingRequest is sent to a provider for embedding generation.
message ProviderEmbeddingRequest {
  string text = 1;
  string model = 2;
}

// ProviderEmbeddingResponse is returned from embedding generation.
message ProviderEmbeddingResponse {
  repeated float embedding = 1;
  int32 dimensions = 2;
  int32 tokens_used = 3;
}

// ProviderEmbeddingBatchRequest is sent for batch embedding generation.
message ProviderEmbeddingBatchRequest {
  repeated string texts = 1;
  string model = 2;
}

// ProviderEmbeddingBatchResponse is returned from batch embedding generation.
message ProviderEmbeddingBatchResponse {
  repeated ProviderEmbeddingResult embeddings = 1;
  int32 total_tokens = 2;
}

// ProviderEmbeddingResult represents a single embedding in a batch response.
message ProviderEmbeddingResult {
  repeated float embedding = 1;
  int32 dimensions = 2;
}

// ProviderChatMessage represents a single message in a chat conversation.
message ProviderChatMessage {
  string role = 1;    // "system", "user", "assistant"
  string content = 2;
}

// ProviderChatRequest is sent to a provider for chat completion.
message ProviderChatRequest {
  repeated ProviderChatMessage messages = 1;
  string model = 2;
  float temperature = 3;
  int32 max_tokens = 4;
}

// ProviderChatResponse is returned from chat completion.
message ProviderChatResponse {
  string content = 1;
  string finish_reason = 2;
  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;
}

// ProviderChatStreamChunk is sent during streaming chat completions.
message ProviderChatStreamChunk {
  string content = 1;
  bool done = 2;
  string finish_reason = 3;
}

// ProviderHealthStatus indicates the health of a provider.
message ProviderHealthStatus {
  bool healthy = 1;
  string message = 2;
  int64 latency_ms = 3;
  string error = 4;
}
