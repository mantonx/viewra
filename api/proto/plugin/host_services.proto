syntax = "proto3";

package viewra.plugin.v1;

option go_package = "github.com/mantonx/viewra/api/proto/plugin/v1;pluginv1";

import "api/proto/plugin/common.proto";

// HostData provides read-only access to ViewRA's media data.
// Plugins use this to query media information.
service HostData {
  // GetMedia retrieves a single media item by ID.
  rpc GetMedia(MediaQuery) returns (Media);

  // GetMediaDetails retrieves full metadata for a media item.
  // Includes plot, cast, genres, mood tags, etc. for AI indexing.
  rpc GetMediaDetails(MediaQuery) returns (MediaDetails);

  // GetMediaByExternalId looks up media by external ID (e.g., IMDB, TMDB).
  rpc GetMediaByExternalId(ExternalIdQuery) returns (Media);

  // SearchMedia searches for media by title/year.
  rpc SearchMedia(SearchQuery) returns (MediaList);

  // ListMediaByLibrary lists all media in a library with pagination.
  rpc ListMediaByLibrary(ListMediaRequest) returns (MediaDetailsList);

  // GetLibrary retrieves library information.
  rpc GetLibrary(LibraryId) returns (Library);

  // GetFilePath returns the full file path for a media item.
  rpc GetFilePath(MediaId) returns (FilePath);
}

// HostStorage provides plugin-scoped storage.
// Each plugin gets its own isolated storage namespace.
service HostStorage {
  // KVGet retrieves a value from the plugin's key-value store.
  rpc KVGet(KVKey) returns (KVValue);

  // KVSet stores a value in the plugin's key-value store.
  rpc KVSet(KVEntry) returns (Empty);

  // KVDelete removes a value from the plugin's key-value store.
  rpc KVDelete(KVKey) returns (Empty);

  // KVList lists keys with an optional prefix.
  rpc KVList(KVListRequest) returns (KVKeyList);

  // GetDatabasePath returns the path to the plugin's SQLite database.
  // DEPRECATED: Use ExecuteSQL/QuerySQL instead for managed storage.
  rpc GetDatabasePath(Empty) returns (DatabasePath);

  // RegisterSchema registers a schema version for migration tracking.
  // DEPRECATED: Use ExecuteSQL with migration tracking instead.
  rpc RegisterSchema(SchemaVersion) returns (Empty);

  // GetDatabaseStats returns storage usage statistics.
  rpc GetDatabaseStats(Empty) returns (DatabaseStats);

  // ExecuteSQL runs DDL/DML statements on plugin's namespaced tables.
  // Table names are automatically prefixed with plugin_{id}_
  // Allowed: CREATE TABLE, CREATE INDEX, DROP TABLE, DROP INDEX,
  //          INSERT, UPDATE, DELETE
  rpc ExecuteSQL(SQLRequest) returns (SQLExecResult);

  // QuerySQL runs SELECT queries on plugin's namespaced tables.
  // Table names are automatically prefixed with plugin_{id}_
  rpc QuerySQL(SQLRequest) returns (SQLQueryResult);

  // === Vector Storage ===
  // Host-managed vector storage with automatic indexing.
  // Uses pgvector (Postgres) or sqlite-vec (SQLite) under the hood.

  // VectorStoreEmbedding stores or updates an embedding for an entity.
  rpc VectorStoreEmbedding(VectorStoreRequest) returns (Empty);

  // VectorStoreBatch stores multiple embeddings in a single transaction.
  rpc VectorStoreBatch(VectorStoreBatchRequest) returns (Empty);

  // VectorSearch performs similarity search using the query vector.
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);

  // VectorSearchText finds embeddings where text contains the query keywords.
  // This is useful for name/title searches where semantic search may fail.
  rpc VectorSearchText(VectorTextSearchRequest) returns (VectorSearchResponse);

  // VectorGet retrieves an embedding by entity type and ID.
  rpc VectorGet(VectorQuery) returns (VectorGetResponse);

  // VectorDelete removes an embedding.
  rpc VectorDelete(VectorQuery) returns (Empty);

  // VectorDeleteByType removes all embeddings for an entity type.
  rpc VectorDeleteByType(VectorTypeQuery) returns (VectorDeleteResponse);

  // VectorCount returns the number of embeddings.
  rpc VectorCount(VectorTypeQuery) returns (VectorCountResponse);
}

// HostUserMetadata provides per-user metadata storage for plugins.
// Used by plugins that need to store user-specific data (e.g., Trakt watched status).
service HostUserMetadata {
  // Get retrieves plugin-specific data for a user.
  rpc Get(UserMetadataKey) returns (UserMetadataValue);

  // Set stores plugin-specific data for a user.
  rpc Set(UserMetadataEntry) returns (Empty);

  // Delete removes plugin-specific data for a user.
  rpc Delete(UserMetadataKey) returns (Empty);

  // ListKeys lists all keys for a user.
  rpc ListKeys(UserId) returns (UserMetadataKeyList);
}

// HostFileParser exposes ViewRA's internal parsing capabilities.
// Useful for external plugins that need to parse local files.
service HostFileParser {
  // ParseNFO parses an NFO file and returns its contents.
  rpc ParseNFO(ParseNFORequest) returns (NFOMetadata);

  // ExtractEmbeddedImages extracts images embedded in media files.
  rpc ExtractEmbeddedImages(ExtractImagesRequest) returns (ExtractImagesResponse);
}

// HostWeather provides weather and time context for query enrichment.
// Plugins need weather:read permission to use this service.
service HostWeather {
  // GetCurrentWeather returns current weather for a user's location.
  // Returns available=false if the user hasn't enabled location.
  rpc GetCurrentWeather(WeatherRequest) returns (WeatherResponse);
}

// HostPlugins provides plugin discovery and capability-based routing.
// Plugins use this to discover and connect to other plugins that provide
// specific capabilities (e.g., "embedding", "chat").
service HostPlugins {
  // ListCapabilities returns all available capabilities and their providers.
  rpc ListCapabilities(Empty) returns (CapabilityListResponse);

  // ListProviders returns all plugins providing a specific capability.
  rpc ListProviders(CapabilityRequest) returns (ProviderListResponse);

  // SetCapabilityPreference sets the preferred plugin for a capability.
  // Used by configuration plugins (e.g., ai-local) to route capabilities.
  // The preference is used when InvokeCapability is called without a preferred_plugin.
  rpc SetCapabilityPreference(CapabilityPreferenceRequest) returns (Empty);

  // ClearCapabilityPreference removes the preference for a capability.
  // After clearing, InvokeCapability falls back to first available provider.
  rpc ClearCapabilityPreference(CapabilityPreferenceRequest) returns (Empty);

  // GetCapabilityPreferences returns all configured capability preferences.
  rpc GetCapabilityPreferences(Empty) returns (CapabilityPreferencesResponse);

  // --- Generic Capability Invocation ---
  // These methods proxy requests to provider plugins via a generic invoke pattern.
  // The host routes based on capability preferences, and providers dispatch by method name.

  // InvokeCapability forwards a request to a capability provider.
  // The host resolves the capability to an available provider and proxies the request.
  // Consumers use typed protos for requests/responses; the transport is generic bytes.
  rpc InvokeCapability(CapabilityInvokeRequest) returns (CapabilityInvokeResponse);

  // InvokeCapabilityStream forwards a streaming request to a capability provider.
  // Used for server-streaming methods like ChatStream.
  rpc InvokeCapabilityStream(CapabilityInvokeRequest) returns (stream CapabilityInvokeResponse);

  // DescribeCapability returns metadata about a capability's available methods.
  // Useful for discovering what methods a capability supports.
  rpc DescribeCapability(DescribeCapabilityRequest) returns (DescribeCapabilityResponse);
}

// HostData messages

message MediaQuery {
  int64 media_id = 1;
  string media_type = 2;  // "movie", "tv_show", "tv_episode", "music_artist", "music_album", "music_track"
}

message MediaId {
  int64 id = 1;
}

message ExternalIdQuery {
  string provider = 1;  // e.g., "imdb", "tmdb", "musicbrainz"
  string external_id = 2;
}

message SearchQuery {
  string title = 1;
  int32 year = 2;
  string media_type = 3;  // "movie", "tv", "music"
  int32 limit = 4;
}

message Media {
  int64 id = 1;
  string media_type = 2;
  string title = 3;
  int32 year = 4;
  string file_path = 5;
  int64 library_id = 6;
  map<string, string> external_ids = 7;
}

message MediaList {
  repeated Media items = 1;
}

message LibraryId {
  int64 id = 1;
}

message Library {
  int64 id = 1;
  string name = 2;
  string path = 3;
  string media_type = 4;
}

message FilePath {
  string path = 1;
}

// ListMediaRequest is used for paginated media listing.
message ListMediaRequest {
  int64 library_id = 1;
  int32 limit = 2;     // Max items per page (default: 100)
  int32 offset = 3;    // Offset for pagination
}

// MediaDetails contains full metadata for AI indexing.
message MediaDetails {
  int64 id = 1;
  string media_type = 2;  // "movie", "tv_show", "tv_episode", "music_artist", "music_album", "music_track"
  string title = 3;
  int32 year = 4;
  int64 library_id = 5;
  map<string, string> external_ids = 6;

  // Rich metadata for embedding generation
  string plot = 7;
  string tagline = 8;
  repeated string genres = 9;
  repeated string directors = 10;
  repeated string writers = 11;
  repeated MediaCastMember cast = 12;
  repeated string studios = 13;
  string content_rating = 14;
  int32 runtime_minutes = 15;
  string original_language = 16;  // ISO 639-1 code, e.g., "en", "ko", "ja"
  string country_of_origin = 17;  // e.g., "United States", "South Korea"
  repeated string producers = 18;  // Producers and executive producers

  // TV-specific
  string show_title = 20;       // For episodes: the parent show title
  int32 season_number = 21;
  int32 episode_number = 22;

  // Music-specific
  string artist_name = 30;      // For albums/tracks
  string album_title = 31;      // For tracks
  string biography = 32;        // For artists
  string country = 33;          // For artists
  string release_type = 34;     // For albums: "album", "single", "ep", etc.

  // Location/setting keywords (from TMDB)
  repeated string location_keywords = 41;  // e.g., ["new york city", "manhattan", "paris"]

  // Theme/topic keywords (from TMDB) - non-location keywords for thematic search
  repeated string theme_keywords = 42;  // e.g., ["redemption", "friendship", "prison escape"]
}

// MediaCastMember represents an actor in a movie/show.
// Simpler than enricher's CastMember - just what's needed for indexing.
message MediaCastMember {
  string name = 1;
  string role = 2;  // Character name
}

// MediaDetailsList is a paginated list of media details.
message MediaDetailsList {
  repeated MediaDetails items = 1;
  int32 total = 2;       // Total count (for pagination)
  bool has_more = 3;     // Whether more items exist
}

// HostStorage messages

message KVKey {
  string key = 1;
}

message KVValue {
  bytes value = 1;
  bool exists = 2;
}

message KVEntry {
  string key = 1;
  bytes value = 2;
  int64 ttl_seconds = 3;  // 0 = no expiration
}

message KVListRequest {
  string prefix = 1;
  int32 limit = 2;
}

message KVKeyList {
  repeated string keys = 1;
}

message DatabasePath {
  string path = 1;
}

message SchemaVersion {
  int32 version = 1;
  string migration_sql = 2;
}

message DatabaseStats {
  int64 size_bytes = 1;
  int64 quota_bytes = 2;
  int32 table_count = 3;
}

// SQL storage messages

message SQLRequest {
  string sql = 1;
  repeated SQLValue args = 2;
}

message SQLValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bytes bytes_value = 4;
    bool is_null = 5;
  }
}

message SQLExecResult {
  int64 rows_affected = 1;
  int64 last_insert_id = 2;
}

message SQLQueryResult {
  repeated string columns = 1;
  repeated SQLRow rows = 2;
}

message SQLRow {
  repeated SQLValue values = 1;
}

// Vector storage messages

message VectorStoreRequest {
  string entity_type = 1;       // e.g., "movie", "tv_show", "track"
  int64 entity_id = 2;          // ID within entity type
  repeated float vector = 3;    // Embedding vector (float32)
  string text = 4;              // Original text that was embedded (optional, for debugging)
  string model = 5;             // Model used to generate embedding (optional, for tracking)
}

message VectorStoreBatchRequest {
  repeated VectorStoreRequest embeddings = 1;
}

message VectorSearchRequest {
  repeated float query_vector = 1;     // Query embedding
  repeated string entity_types = 2;    // Filter by types (empty = all)
  int32 limit = 3;                     // Max results (default: 20)
  int32 offset = 4;                    // Pagination offset
  float min_similarity = 5;            // Minimum similarity threshold (0.0-1.0)
}

message VectorTextSearchRequest {
  string query = 1;                    // Text to search for (case-insensitive)
  repeated string entity_types = 2;    // Filter by types (empty = all)
  int32 limit = 3;                     // Max results (default: 100)
}

message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
  int32 total_count = 2;               // Total matching embeddings
}

message VectorSearchResult {
  string entity_type = 1;
  int64 entity_id = 2;
  float similarity = 3;                // Cosine similarity (0.0-1.0)
  string text = 4;                     // Original embedded text
}

message VectorQuery {
  string entity_type = 1;
  int64 entity_id = 2;
}

message VectorGetResponse {
  bool exists = 1;
  repeated float vector = 2;
  string text = 3;
  string model = 4;
  int32 dimensions = 5;
}

message VectorTypeQuery {
  string entity_type = 1;              // Empty = all types
}

message VectorDeleteResponse {
  int64 deleted_count = 1;
}

message VectorCountResponse {
  int64 count = 1;
}

// HostUserMetadata messages

message UserId {
  string user_id = 1;
}

message UserMetadataKey {
  string user_id = 1;
  string key = 2;
}

message UserMetadataValue {
  bytes value = 1;
  bool exists = 2;
}

message UserMetadataEntry {
  string user_id = 1;
  string key = 2;
  bytes value = 3;
}

message UserMetadataKeyList {
  repeated string keys = 1;
}

// HostFileParser messages

message ParseNFORequest {
  string file_path = 1;
  string nfo_type = 2;  // "movie", "tvshow", "episode", "artist", "album"
}

message NFOMetadata {
  bool found = 1;
  string title = 2;
  string original_title = 3;
  int32 year = 4;
  string plot = 5;
  string tagline = 6;
  repeated string genres = 7;
  string content_rating = 8;
  int32 runtime_minutes = 9;
  float rating = 10;
  map<string, string> external_ids = 11;
  repeated string directors = 12;
  repeated string writers = 13;
  repeated NFOActor actors = 14;
  repeated string studios = 15;
}

message NFOActor {
  string name = 1;
  string role = 2;
  string thumb = 3;
  int32 order = 4;
}

message ExtractImagesRequest {
  string file_path = 1;
  repeated string types = 2;  // e.g., ["poster", "fanart"]
}

message ExtractImagesResponse {
  repeated ExtractedImage images = 1;
}

message ExtractedImage {
  string type = 1;
  string path = 2;  // Path where image was saved
  int32 width = 3;
  int32 height = 4;
}

// HostWeather messages

message WeatherRequest {
  string user_id = 1;  // User ID to look up location preferences
}

message WeatherResponse {
  bool available = 1;           // False if user hasn't enabled location
  float temperature = 2;        // Celsius
  int32 humidity = 3;           // Percentage (0-100)
  bool is_day = 4;              // True if daylight
  float precipitation = 5;      // mm
  int32 cloud_cover = 6;        // Percentage (0-100)
  int32 weather_code = 7;       // WMO weather interpretation code
  string condition = 8;         // Simplified: sunny, cloudy, rainy, snowy, stormy, foggy
  string time_of_day = 9;       // morning, afternoon, evening, night
  string season = 10;           // spring, summer, fall, winter
}

// HostPlugins messages

message CapabilityRequest {
  string capability = 1;          // Capability name, e.g., "embedding", "chat"
  string preferred_plugin = 2;    // Optional: specific plugin ID to prefer
}

message CapabilityListResponse {
  repeated CapabilityInfo capabilities = 1;
}

message CapabilityInfo {
  string name = 1;                // Capability name
  repeated PluginProviderInfo providers = 2;
}

message PluginProviderInfo {
  string plugin_id = 1;           // Plugin ID
  string plugin_name = 2;         // Human-readable name
  bool enabled = 3;               // Whether the plugin is enabled
  bool configured = 4;            // Whether the plugin is properly configured
}

message ProviderListResponse {
  repeated PluginProviderInfo providers = 1;
}

// CapabilityPreferenceRequest sets or clears a capability preference.
message CapabilityPreferenceRequest {
  string capability = 1;          // Capability name, e.g., "embedding", "chat"
  string plugin_id = 2;           // Plugin ID to prefer (empty to clear in ClearCapabilityPreference)
}

// CapabilityPreferencesResponse returns all configured preferences.
message CapabilityPreferencesResponse {
  map<string, string> preferences = 1;  // capability -> plugin_id
}

// --- Generic Capability Invocation Messages ---

// CapabilityInvokeRequest is sent to invoke a method on a capability provider.
message CapabilityInvokeRequest {
  string capability = 1;           // e.g., "embedding", "chat"
  string method = 2;               // e.g., "GenerateEmbedding", "Chat"
  bytes request_payload = 3;       // Serialized protobuf request message
  string preferred_plugin = 4;     // Optional: prefer specific provider
  string api_version = 5;          // Optional: capability API version (e.g., "v1")
  map<string, string> metadata = 6; // Optional: request metadata (tracing, etc.)
}

// CapabilityInvokeResponse is returned from a capability invocation.
message CapabilityInvokeResponse {
  bytes response_payload = 1;      // Serialized protobuf response message
  CapabilityError error = 2;       // Structured error (null if success)
  string provider_plugin = 3;      // Which plugin handled the request
  int64 latency_ms = 4;            // How long the provider took
  map<string, string> metadata = 5; // Response metadata from provider
}

// CapabilityError represents a structured error from a capability call.
message CapabilityError {
  CapabilityErrorCode code = 1;
  string message = 2;
  string details = 3;              // Additional context (JSON or text)
  bool retryable = 4;              // Whether consumer should retry
}

// CapabilityErrorCode enumerates error types for capability invocations.
enum CapabilityErrorCode {
  CAPABILITY_ERROR_UNSPECIFIED = 0;
  CAPABILITY_ERROR_NOT_FOUND = 1;        // Capability not available
  CAPABILITY_ERROR_METHOD_NOT_FOUND = 2; // Method not supported
  CAPABILITY_ERROR_INVALID_REQUEST = 3;  // Malformed request payload
  CAPABILITY_ERROR_PROVIDER_ERROR = 4;   // Provider returned an error
  CAPABILITY_ERROR_TIMEOUT = 5;          // Provider timed out
  CAPABILITY_ERROR_RATE_LIMITED = 6;     // Too many requests
  CAPABILITY_ERROR_NOT_CONFIGURED = 7;   // Provider not configured
  CAPABILITY_ERROR_VERSION_MISMATCH = 8; // API version incompatible
}

// DescribeCapabilityRequest asks for metadata about a capability.
message DescribeCapabilityRequest {
  string capability = 1;
}

// DescribeCapabilityResponse contains metadata about a capability.
message DescribeCapabilityResponse {
  string capability = 1;
  string api_version = 2;                    // Current API version
  repeated string supported_versions = 3;    // All supported versions
  repeated CapabilityMethodInfo methods = 4;
  repeated DescribeCapabilityProviderInfo providers = 5; // Available providers
}

// CapabilityMethodInfo describes a method available on a capability.
message CapabilityMethodInfo {
  string name = 1;                    // e.g., "GenerateEmbedding"
  string description = 2;
  bool is_streaming = 3;              // Server-streaming method
  string request_type = 4;            // Proto message type name
  string response_type = 5;           // Proto message type name
}

// DescribeCapabilityProviderInfo describes a provider for a capability in DescribeCapability responses.
message DescribeCapabilityProviderInfo {
  string plugin_id = 1;
  string plugin_name = 2;
  bool enabled = 3;
  bool configured = 4;
  bool is_preferred = 5;              // Currently the preferred provider
}
