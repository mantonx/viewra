      consumes:
      - application/json
      description: Creates a new media library
      parameters:
      - description: Library details
        in: body
        name: library
        required: true
        schema:
          $ref: '#/definitions/github_com_mantonx_viewra_internal_application_library.CreateLibraryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mantonx_viewra_internal_application_library.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Create a new library
      tags:
      - libraries
  /api/libraries/{id}:
    delete:
      description: Deletes a library and all its media entries (does not delete files)
      parameters:
      - description: Library ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
