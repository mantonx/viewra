      tags:
      - enrichment
  /api/enrichment/stats:
    get:
      description: Returns queue statistics for all enrichment stages
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/github_com_mantonx_viewra_internal_domain_enrichment.QueueStats'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Get enrichment queue statistics
      tags:
      - enrichment
  /api/filesystem/browse:
    get:
      description: Browse directories for library path selection
      parameters:
      - description: Directory path to browse
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_viewra_internal_domain_library.BrowseResult'
        "400":
          description: Invalid path
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "404":
          description: Directory not found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Browse server filesystem
      tags:
      - filesystem
  /api/images/{id}:
    get:
      description: Returns metadata for a specific image
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_viewra_internal_application_images.ImageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Get image metadata by ID
      tags:
      - images
  /api/images/{id}/file:
    get:
      description: |-
        Serves pre-generated image presets. All images are in WebP format with multiple sizes available.
        Available presets: thumb, medium, large, xlarge (depending on image type).
        If no preset is specified, serves the medium size by default.
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: integer
      - description: Preset name (thumb, medium, large, xlarge)
        in: query
        name: preset
        type: string
      produces:
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Serve image file
      tags:
      - images
  /api/images/batch:
    post:
      consumes:
      - application/json
      description: Returns images for multiple media items (movies, episodes) or entities
        (TV shows, artists) in a single request to reduce N+1 queries
      parameters:
      - description: Batch request with either media_ids or (entity_ids + media_type)
        in: body
        name: request
        required: true
        schema:
          properties:
            entity_ids:
              items:
                type: integer
              type: array
            media_ids:
              items:
                type: integer
              type: array
            media_type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_viewra_internal_application_images.BatchImagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Get images for multiple media items or entities
      tags:
      - images
