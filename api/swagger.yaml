host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: ViewRA Support
    url: http://www.swagger.io/support
  description: Self-hosted media server for movies, TV shows, and music
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ViewRA Media Server API
  version: 0.0.1
paths:
  /api/filesystem/browse:
    get:
      description: Browse directories for library path selection
      parameters:
      - description: Directory path to browse
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_viewra_viewra_internal_domain_library.BrowseResult'
        "400":
          description: Invalid path
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "404":
          description: Directory not found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Browse server filesystem
      tags:
      - filesystem
  /api/images/{id}:
    get:
      description: Returns metadata for a specific image
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_viewra_viewra_internal_application_images.ImageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Get image metadata by ID
      tags:
      - images
  /api/images/{id}/file:
    get:
      description: |-
        Serves pre-generated image presets. All images are in WebP format with multiple sizes available.
        Available presets: thumb, medium, large, xlarge (depending on image type).
        If no preset is specified, serves the medium size by default.
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: integer
      - description: Preset name (thumb, medium, large, xlarge)
        in: query
        name: preset
        type: string
      produces:
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Serve image file
      tags:
      - images
  /api/images/batch:
    post:
      consumes:
      - application/json
      description: Returns images for multiple media items in a single request to
        reduce N+1 queries
      parameters:
      - description: Media IDs
        in: body
        name: request
        required: true
        schema:
          properties:
            media_ids:
              items:
                type: integer
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_viewra_viewra_internal_application_images.BatchImagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: Get images for multiple media items
      tags:
      - images
  /api/libraries:
    get:
      description: Returns a list of all libraries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_viewra_viewra_internal_application_library.ListLibrariesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
      summary: List all libraries
      tags:
      - libraries
    post:
      consumes:
      - application/json
      description: Creates a new media library
      parameters:
      - description: Library details
        in: body
        name: library
        required: true
        schema:
          $ref: '#/definitions/github_com_viewra_viewra_internal_application_library.CreateLibraryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_viewra_viewra_internal_application_library.LibraryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_handlers.ErrorResponse'
