<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Audio Test - Episode 11055</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>HLS Audio Test - Episode 11055</h1>
    <video id="video" controls style="width: 80%; max-width: 800px;"></video>
    <div id="info"></div>

    <script>
        const video = document.getElementById('video');
        const info = document.getElementById('info');
        const hlsUrl = 'http://localhost:8080/api/media/11055/hls/1080p/playlist.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: true,
                enableWorker: true
            });

            hls.loadSource(hlsUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                info.innerHTML += '<p>Manifest loaded successfully</p>';
                info.innerHTML += '<p>Audio tracks: ' + (hls.audioTracks ? hls.audioTracks.length : 0) + '</p>';
                info.innerHTML += '<p>Levels: ' + hls.levels.length + '</p>';

                // Try to play
                video.muted = false;
                video.volume = 1.0;
                video.play().then(() => {
                    info.innerHTML += '<p style="color: green;">✓ Playing with audio</p>';
                }).catch((err) => {
                    info.innerHTML += '<p style="color: red;">✗ Play failed: ' + err.message + '</p>';
                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error('HLS error:', data);
                info.innerHTML += '<p style="color: red;">Error: ' + data.type + ' - ' + data.details + '</p>';
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = hlsUrl;
            video.addEventListener('loadedmetadata', function() {
                info.innerHTML += '<p>Using native HLS</p>';
                video.muted = false;
                video.volume = 1.0;
                video.play();
            });
        }

        // Monitor audio
        video.addEventListener('playing', function() {
            info.innerHTML += '<p>Video is playing. Muted: ' + video.muted + ', Volume: ' + video.volume + '</p>';
        });

        video.addEventListener('volumechange', function() {
            info.innerHTML += '<p>Volume changed: muted=' + video.muted + ', volume=' + video.volume + '</p>';
        });
    </script>
</body>
</html>
