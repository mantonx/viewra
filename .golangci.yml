# golangci-lint configuration for ViewRA
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment  # Too noisy for now

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/viewra/viewra

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - whyNoLint
      - unnamedResult

  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  staticcheck:
    checks: ["all"]

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    dot-import-whitelist: []
    initialisms: ["ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "DASH", "HLS"]
    http-status-code-whitelist: ["200", "400", "404", "500"]

  gosec:
    excludes:
      - G104  # Audit errors not checked (too many false positives)
      - G114  # Use of net/http serve function that has no support for setting timeouts
    confidence: medium

  misspell:
    locale: US

  unused:
    check-exported: false

  unparam:
    check-exported: false

  cyclop:
    max-complexity: 25
    skip-tests: true

  funlen:
    lines: 150
    statements: 75

  lll:
    line-length: 120
    tab-width: 4

  nestif:
    min-complexity: 5

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - gofmt
    - revive
    - stylecheck
    - misspell
    - unconvert
    - unparam
    - gosec
    - gocritic
    - cyclop
    - funlen
    - nestif
    - lll
    - gocyclo
    - dupl
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

  disable:
    - typecheck  # Can be slow and redundant with gopls
    - varnamelen # Too strict for our use case
    - exhaustive # Too noisy
    - exhaustruct # Too strict
    - wsl # Whitespace linter - too opinionated
    - nlreturn # Too opinionated about returns
    - wrapcheck # Too noisy with error wrapping

  fast: false

issues:
  exclude-dirs:
    - vendor
    - node_modules
    - internal/infrastructure/database/sqlc
    - internal/infrastructure/database/sqlc_postgres
    - internal/infrastructure/database/sqlc_sqlite

  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"

  uniq-by-line: true

  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - funlen
        - cyclop
        - gocyclo
        - errcheck

    # Exclude known false positives
    - text: "G304: Potential file inclusion via variable"
      linters:
        - gosec

    - text: "G204: Subprocess launched with a potential tainted input"
      linters:
        - gosec

    - text: "G301: Expect directory permissions to be 0750 or less"
      linters:
        - gosec

    - text: "G115: integer overflow conversion"
      linters:
        - gosec

    - text: "package-comments: should have a package comment"
      linters:
        - revive

    - text: "stutters"
      linters:
        - revive

    - text: "rangeValCopy"
      linters:
        - gocritic

    - text: "exitAfterDefer"
      linters:
        - gocritic

    - text: "elseif: can replace"
      linters:
        - gocritic

    - text: "Error return value of.*is not checked"
      linters:
        - errcheck
      path: cmd/viewra/main.go

    - text: "Error return value of.*Close.*is not checked"
      linters:
        - errcheck

    - text: "SA5011"
      linters:
        - staticcheck
      path: _test\.go

    - text: "Error return value is not checked"
      linters:
        - errcheck
      path: internal/infrastructure/persistence/

    # Ignore sqlc generated code
    - path: internal/infrastructure/database/sqlc
      linters:
        - all

  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false

severity:
  default-severity: error
  case-sensitive: false
