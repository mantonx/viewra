# ViewRA Development Docker Compose
#
# Usage:
#   docker compose -f docker-compose.dev.yml up                     # CPU transcoding
#   docker compose -f docker-compose.dev.yml --profile postgres up  # With PostgreSQL
#
# Ollama is included by default for AI features (semantic search, embeddings).
# First build takes ~10 min (FFmpeg compilation), subsequent builds use Docker cache.
#
# GPU Acceleration:
#   Uncomment the relevant section in the backend service below:
#   - NVIDIA: requires nvidia-container-toolkit
#   - Intel/AMD: requires /dev/dri on host

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: viewra-backend
    entrypoint: ["/app/docker/entrypoint.dev.sh"]
    command: ["air", "-c", ".air.toml"]
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - /app/web/node_modules
      - /app/tmp
      - /cifs/fictionalserver/movies:/media/movies:ro
      - /cifs/fictionalserver/tv:/media/tv:ro
      - /cifs/fictionalserver/music:/media/music:ro
    ports:
      - "8080:8080"
      - "6060:6060"
    environment:
      - ENVIRONMENT=development
      - DATA_DIR=/app/data
      - DB_DRIVER=sqlite
      - DB_PATH=/app/data/viewra.db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=viewra
      - DB_PASSWORD=viewra
      - DB_NAME=viewra
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_started
        required: false
      ollama:
        condition: service_started
        required: false
    # ─────────────────────────────────────────────────────────────────
    # GPU Acceleration - uncomment ONE of the following sections:
    # ─────────────────────────────────────────────────────────────────
    #
    # NVIDIA GPU (NVENC/NVDEC) - requires nvidia-container-toolkit:
    #   Install: sudo pacman -S nvidia-container-toolkit (Arch)
    #            sudo apt install nvidia-container-toolkit (Ubuntu)
    #   Configure: sudo nvidia-ctk runtime configure --runtime=docker
    #              sudo systemctl restart docker
    #   Docs: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    #
    # Intel/AMD GPU (QSV/VAAPI) - requires /dev/dri on host:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    # ─────────────────────────────────────────────────────────────────

  frontend:
    image: node:22-alpine
    container_name: viewra-frontend
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - web-node-modules:/app/web/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: viewra-postgres-dev
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: viewra
      POSTGRES_PASSWORD: viewra
      POSTGRES_DB: viewra
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewra"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: viewra-ollama-dev
    volumes:
      - ollama-dev-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Pulls required models on first startup (runs once then exits)
  ollama-init:
    image: ollama/ollama:latest
    container_name: viewra-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
  postgres-dev-data:
  ollama-dev-data:
